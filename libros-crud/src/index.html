<h1>📚 Colección de libros</h1>

<div class="formulario">

  <h2>
    {{ editando ? 'Editar libro' : 'Nuevo libro' }}
  </h2>

  <label>Título</label>

  <input
    type="text"
    [(ngModel)]="libro.titulo"
    placeholder="Título del libro"
  >

  <label>Autor</label>

  <input
    type="text"
    [(ngModel)]="libro.autor"
    placeholder="Autor"
  >

  <label>Año</label>

  <input
    type="number"
    [(ngModel)]="libro.año"
  >

  <button (click)="guardarLibro()">
    {{ editando ? 'Actualizar' : 'Añadir' }}
  </button>

  @if (editando) {

    <button (click)="nuevoLibro()">
      Cancelar
    </button>

  }

</div>


<h2>Libros</h2>

<table>

  <thead>

    <tr>
      <th>ID</th>
      <th>Título</th>
      <th>Autor</th>
      <th>Año</th>
      <th>Acciones</th>
    </tr>

  </thead>

  <tbody>

    @for (libro of libros; track libro.id) {

      <tr>

        <td>{{ libro.id }}</td>

        <td>{{ libro.titulo }}</td>

        <td>{{ libro.autor }}</td>

        <td>{{ libro.año }}</td>

        <td>

          <button (click)="editarLibro(libro)">
            ✏️ Editar
          </button>

          <button (click)="eliminarLibro(libro.id)">
            🗑️ Eliminar
          </button>

        </td>

      </tr>

    }

  </tbody>

</table>
